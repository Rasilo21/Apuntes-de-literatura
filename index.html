<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quiz interactivo sobre literatura medieval española.">
  <title>Quiz · Literatura medieval</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="hero">
      <p class="eyebrow">Literatura I · Proyecto universitario</p>
      <h1>La literatura medieval</h1>
      <p class="subtitle">Pon a prueba lo que sabes sobre la literatura medieval española.</p>
    </header>

    <section class="quiz-card" aria-live="polite">
      <div class="topline">
        <span id="question-counter">Pregunta 1 de 12</span>
        <span id="score-label">Aciertos: 0</span>
      </div>
      <div class="progress-track" aria-label="Progreso del cuestionario">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div id="quiz-content">
        <p id="category" class="category">Características</p>
        <h2 id="question">Pregunta</h2>
        <div id="answers" class="answers"></div>
        <p id="feedback" class="feedback" role="status"></p>
        <button id="next-button" class="primary-button" disabled>Siguiente</button>
      </div>

      <div id="result-screen" class="result-screen" hidden>
        <p class="category">Cuestionario terminado</p>
        <h2>¡Buen trabajo!</h2>
        <p id="final-score" class="final-score"></p>
        <p id="final-message"></p>
        <button id="restart-button" class="primary-button">Volver a jugar</button>
      </div>
    </section>
    <footer>Hecho para repasar · Literatura medieval española</footer>
  </main>
</body>
</html>
